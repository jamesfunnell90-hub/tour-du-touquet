<meta charset="utf-8"><title>Tour du Touquet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --ground:#F2F5F0; --surface:#FFFFFF; --sunk:#E8EEE7; --ink:#14261F; --muted:#5A6A62; --line:#D6DFD6;
  --fairway:#1E5A3E; --fairway-ink:#FFFFFF; --flag:#D9A72C; --blue:#2F5DA8; --claret:#8E2C48;
  --under:#C9302A; --over:#3B4A43; --dot:#1E5A3E;
  --sketch:#5E7C8E; --sketch-soft:#A9BCC6; --sand:#E9EEF0; --sketch-green:#DCE7DD; --tri-blue:#2A4B8D; --tri-red:#C8373B;
  --serif:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1512; --surface:#15201B; --sunk:#1B2923; --ink:#E3ECE6; --muted:#93A39A; --line:#27352F;
    --fairway:#3E9A6C; --fairway-ink:#06110C; --flag:#E6C05A; --blue:#86A9EC; --claret:#E08AA2;
    --under:#FF6F62; --over:#C9D4CE; --dot:#6CC596; --sketch:#8FA9B8; --sketch-soft:#4A5E69; --sand:#17242A; --sketch-green:#1C3027; --tri-blue:#8EA8E0; --tri-red:#FF7A72;
  }
}
:root[data-theme="dark"]{
  --ground:#0D1512; --surface:#15201B; --sunk:#1B2923; --ink:#E3ECE6; --muted:#93A39A; --line:#27352F;
  --fairway:#3E9A6C; --fairway-ink:#06110C; --flag:#E6C05A; --blue:#86A9EC; --claret:#E08AA2;
  --under:#FF6F62; --over:#C9D4CE; --dot:#6CC596; --sketch:#8FA9B8; --sketch-soft:#4A5E69; --sand:#17242A; --sketch-green:#1C3027; --tri-blue:#8EA8E0; --tri-red:#FF7A72;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--fairway);color:var(--fairway-ink);padding:10px 16px 12px}
.top .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase}
.ctx{font-size:13px;opacity:.85}
.sample{font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;border-radius:4px;padding:1px 6px;opacity:.85;white-space:nowrap}
main{padding:16px;display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pad{padding:14px}

/* cup board */
.cup{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px 14px;gap:8px}
.cup .team{display:flex;flex-direction:column;gap:2px}
.cup .team.r{text-align:right}
.cup .tname{font-weight:700;font-size:14px}
.cup .pts{font-family:var(--display);font-weight:700;font-size:54px;line-height:1}
.cup .mid{text-align:center;color:var(--muted);font-size:12px;line-height:1.2}
.cup .mid b{display:block;font-family:var(--display);font-size:18px;color:var(--ink)}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:flex;margin:0 14px 14px}
.bar i{display:block;height:100%}
.tb{color:var(--blue)} .tc{color:var(--claret)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.live{background:var(--fairway);color:var(--fairway-ink)}
.chip.done{background:transparent;border:1px solid var(--line)}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

.nine{display:flex;flex-direction:column}
.nine .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.nine .title{font-weight:700}
.nine .fmt{font-size:13px;color:var(--muted)}
.status{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.big{font-family:var(--display);font-weight:700;font-size:26px;line-height:1}
.muted{color:var(--muted)}
.vs{display:grid;grid-template-columns:1fr 24px 1fr;align-items:center}.vs>:nth-child(2){text-align:center}.vs>:last-child{text-align:right}
.small{font-size:13px}
.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px 14px}
.gcard{background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:13px}
.gcard b{font-family:var(--display);font-size:17px}

/* score */
.seg{display:flex;background:var(--sunk);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:6px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.strip{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.strip button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 0;font-family:var(--display);font-weight:600;font-size:16px;cursor:pointer}
.strip button.done{background:var(--sunk);color:var(--muted)}
.strip button.cur{background:var(--flag);border-color:var(--flag);color:#1b1500}
.hole{display:grid;grid-template-columns:104px 1fr;gap:14px;padding:14px}
.hole img{width:104px;height:152px;object-fit:cover;object-position:top;border-radius:6px;background:var(--sunk)}
.hno{font-family:var(--display);font-weight:700;font-size:44px;line-height:.9}
.hname{font-weight:700;font-size:17px;margin-top:2px}
.facts{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:4px 18px;margin-top:10px}
.facts span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts b{font-family:var(--display);font-size:24px;font-weight:600;display:block;line-height:1}
.unit{border:1px solid var(--line);background:transparent;border-radius:4px;font-size:11px;padding:0 4px;margin-left:2px;cursor:pointer;color:var(--muted)}
.plist{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.pname{font-weight:700;display:flex;align-items:center;gap:6px}
.pmeta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:2px}
.dots{letter-spacing:1px;color:var(--dot);font-size:14px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:600;cursor:pointer;line-height:1}
.step .pu{width:36px;height:36px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted)}
.step .pu[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.val{width:44px;text-align:center;font-family:var(--display);font-weight:700;font-size:34px;line-height:1}
.val.ghost{color:var(--muted);opacity:.45}
.val.u{color:var(--under)}
.ptsTag{font-family:var(--display);font-size:15px;font-weight:600;color:var(--fairway)}
.nav{display:flex;gap:10px}
.nav button{flex:1;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.nav button.primary{background:var(--fairway);color:var(--fairway-ink);border-color:var(--fairway)}
.matchbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--sunk);border-radius:0 0 10px 10px;font-size:14px;font-weight:600}

/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.l,th.l{text-align:left;padding-left:14px}
td .g{font-family:var(--display);font-size:18px;font-weight:600}
td.u .g{color:var(--under)}
tr.par td{color:var(--muted);font-size:12px}
.rank{font-family:var(--display);font-size:20px;font-weight:700;width:34px}
.tot{font-family:var(--display);font-size:22px;font-weight:700}

/* more */
.list{display:flex;flex-direction:column}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;border-top:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;cursor:pointer}
.item:first-child{border-top:0}
.item .sub{font-size:13px;color:var(--muted)}
.item .go{color:var(--muted);font-size:18px}
.field{display:flex;flex-direction:column;gap:4px;padding:10px 14px;border-top:1px solid var(--line)}
.field label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field select{font:inherit;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0}
.lock{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.log{font-size:13px;display:flex;flex-direction:column;gap:6px}
.note{font-size:13px;color:var(--muted);padding:0 2px}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:transparent;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--fairway)}
@media (prefers-reduced-motion:no-preference){.step button:active,.nav button:active{transform:scale(.96)}}

/* Tour identity */
.brandrow{display:flex;align-items:center;gap:10px}
.badge{width:46px;height:46px;flex:none;border-radius:50%;background:#F7F1EB;display:grid;place-items:center;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.badge img{width:40px;height:40px;object-fit:contain}

.heroBadge{width:58px;height:auto;flex:none}
.heroLeft{display:flex;gap:10px;align-items:center}
.brand{font-family:var(--serif)!important;font-weight:700;font-size:23px!important;letter-spacing:.04em;text-transform:none!important;line-height:1}
.brand small{display:block;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-top:2px}
.hero{position:relative;overflow:hidden;padding:0}
.hero .art{margin-top:2px}
.hero .top2{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px 0}
.sketch path{fill:none;stroke-linecap:round}
.sketch .k1{stroke:var(--sketch);stroke-width:1.1}
.sketch .k2{stroke:var(--sketch);stroke-width:.7;opacity:.8}
.sketch .k3{stroke:var(--sketch-soft);stroke-width:.6}
.sketch .fill1{fill:var(--sand);stroke:none}
.sketch .fill2{fill:var(--sand);stroke:none;opacity:.7}
.sketch .green{fill:var(--sketch-green);stroke:var(--sketch);stroke-width:.6}
.sketch .bld{fill:var(--surface);stroke:var(--sketch);stroke-width:.7}
.sketch .flag{fill:var(--tri-red);stroke:none}
.motto{padding:14px 8px 0;text-align:center;font-family:var(--serif);font-weight:700;font-size:clamp(14px,4.4vw,21px);letter-spacing:.08em;color:var(--tri-blue);white-space:nowrap;}
.motto i{font-style:normal;color:var(--tri-red);margin:0 .35em}
.route{width:160px;height:44px;color:var(--tri-blue);flex:none}
.route text{font-family:var(--serif);font-weight:700;font-size:11px;letter-spacing:.06em;fill:currentColor}
.heroTitle{line-height:1.15;font-family:var(--serif);font-style:italic;font-weight:600;font-size:15px;color:var(--muted)}
.footart{margin-top:4px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface);position:relative}
.footart .sketch{display:block;width:100%;height:auto;aspect-ratio:4/1}
.footart .motto{font-size:15px;padding-top:10px}
</style>

<style>
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.segcard{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);text-align:left;cursor:pointer}
.segcard[aria-pressed="true"]{border-color:var(--fairway);box-shadow:inset 0 0 0 1px var(--fairway)}
.segcard .k{font-family:var(--display);font-weight:700;font-size:17px;line-height:1}
.segcard .d{font-size:12px;color:var(--muted)}
.strip6{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.strip6 button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 0;font-family:var(--display);font-weight:600;font-size:16px;cursor:pointer}
.strip6 button.done{background:var(--sunk);color:var(--muted)}
.strip6 button.cur{background:var(--flag);border-color:var(--flag);color:#1b1500}
.hb{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:12px 14px;background:var(--sunk);border-radius:0 0 10px 10px}
.hb .side{display:flex;flex-direction:column;gap:2px}
.hb .side.r{text-align:right}
.hb .n{font-family:var(--display);font-weight:700;font-size:30px;line-height:1}
.hb .mid{text-align:center;font-size:12px;color:var(--muted)}
.hb .mid b{display:block;font-size:14px;color:var(--ink)}
.counted{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fairway)}
.notcounted{opacity:.55}
.dotrow{display:flex;gap:3px;flex-wrap:wrap}
.hd{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font-family:var(--display);font-size:13px;font-weight:700;background:var(--sunk);color:var(--muted)}
.hd.w0{color:#fff}
.hd.h{background:transparent;border:1px dashed var(--line)}
.big{font-size:22px!important}
.field .two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.field select,.two select{min-width:0;width:100%}
.two>.field{min-width:0}
.ask{border-left:3px solid var(--flag);padding:8px 12px;background:var(--surface);border-radius:0 8px 8px 0;font-size:13px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.vs>:nth-child(2){text-align:center}.vs>:last-child{text-align:right}
</style>

const P={james:{n:"James",h:14,t:"ab"},luke:{n:"Luke",h:9,t:"ab"},will:{n:"Will",h:22,t:"ab"},alex:{n:"Alex",h:18,t:"bb"},chris:{n:"Chris",h:6,t:"bb"},ronak:{n:"Ronak",h:11,t:"bb"}};
const GROUPS=[{time:"09:40",team:"ab",ids:["james","luke","will"]},{time:"09:50",team:"bb",ids:["alex","chris","ronak"]}];
const SEGS=[{from:1,to:6,count:1,label:"Best 1 of 3"},{from:7,to:12,count:2,label:"Best 2 of 3"},{from:13,to:18,count:3,label:"All 3 count"}];
// sample gross scores (index 0 = hole 1)
const S={
  james:[5,5,4,6,5,4,5,6],luke:[4,5,3,5,5,3,4,5],will:[6,6,4,7,5,4,6,6],
  alex:[5,6,3,6,6,4,5,5],chris:[4,4,4,5,4,3,5,4],ronak:[5,5,3,6,5,4,4,6]
};
const R2=[["james","alex"],["luke","chris"],["will","ronak"]];
const st={tab:"live",group:0,seg:1,hole:{0:9,1:9},board:"cup"};
try{const t=localStorage.getItem("tdt-mock2-tab"); if(t) st.tab=t;}catch(e){}
const $=s=>document.querySelector(s);
const sw=t=>`<span class="sw" style="background:${T[t].c}"></span>`;
const shots=(h,si)=>Math.floor(h/18)+(si<=h%18?1:0);
const g=(id,n)=>S[id][n-1];
const net=(id,n)=>{const v=g(id,n); return v==null?null:v-shots(P[id].h,H[n-1].si);};
const team=t=>Object.keys(P).filter(k=>P[k].t===t);
const segOf=n=>SEGS.find(s=>n>=s.from&&n<=s.to);
function teamHole(t,n){const s=segOf(n); const v=team(t).map(id=>({id,v:net(id,n)})); if(v.some(x=>x.v==null)) return null; v.sort((a,b)=>a.v-b.v); const used=v.slice(0,s.count); return {score:used.reduce((a,x)=>a+x.v,0),used:used.map(x=>x.id)};}
function hole(n){const a=teamHole("ab",n),b=teamHole("bb",n); if(!a||!b) return null; return {a,b,w:a.score<b.score?"ab":b.score<a.score?"bb":null};}
function segResult(s){let wa=0,wb=0,hv=0,th=0; const rows=[]; for(let n=s.from;n<=s.to;n++){const r=hole(n); if(!r) break; th=n; rows.push({n,...r}); if(r.w==="ab")wa++; else if(r.w==="bb")wb++; else hv++;}
  const played=rows.length, left=(s.to-s.from+1)-played, done=left===0||Math.abs(wa-wb)>left;
  return {wa,wb,hv,played,left,done,rows,leader:wa>wb?"ab":wb>wa?"bb":null};}
function segText(r){ if(!r.played) return "Not started"; const d=Math.abs(r.wa-r.wb); const who=r.leader?T[r.leader].name:null;
  if(r.done) return who?`${who} win ${r.left?`${d}&${r.left}`:`${d} up`}`:"Halved";
  return who?`${who} ${d} up thru ${r.played}`:`All square thru ${r.played}`;}
function cup(){const c={ab:0,bb:0}; SEGS.forEach(s=>{const r=segResult(s); if(r.done){ if(r.leader) c[r.leader]+=1; else {c.ab+=.5;c.bb+=.5;} }}); return c;}
const fp=v=>v%1?(Math.floor(v)||"")+"½":String(v);

function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===st.tab?"page":"false"));
  $("#ctx").textContent="Round 1 · Sat 19 Sep · Golf de Belle Dune · Jaune tees";
  $("#view").innerHTML=({live:vLive,score:vScore,board:vBoard,more:vMore})[st.tab]()+(st.tab!=="live"?`<div class="panel hero" style="margin-top:4px">${MOTTO}<div class="art"></div></div>`:"");
}

function vLive(){
  const c=cup();
  let h=`<section class="panel hero">${MOTTO}<div class="art"></div></section>
  <section class="panel"><div class="cup">
    <div class="team"><span class="tname tb">${T.ab.name}</span><span class="pts num tb">${fp(c.ab)}</span></div>
    <div class="mid"><b>${fp(c.ab+c.bb)} of 6</b>points decided</div>
    <div class="team r"><span class="tname tc">${T.bb.name}</span><span class="pts num tc">${fp(c.bb)}</span></div></div>
    <div class="bar"><i style="width:${c.ab/6*100}%;background:var(--blue)"></i><i style="flex:1"></i><i style="width:${c.bb/6*100}%;background:var(--claret)"></i></div></section>
  <h2>Round 1 · Belle Dune · Team 6-6-6</h2>`;
  SEGS.forEach((s,i)=>{const r=segResult(s);
    const chip=r.done?`<span class="chip done">Final</span>`:r.played?`<span class="chip live">Live</span>`:`<span class="chip">Not started</span>`;
    h+=`<section class="panel nine"><div class="head"><div><div class="title">Holes ${s.from}–${s.to} · ${s.label}</div><div class="fmt">${s.count===1?"Best net score of the three":s.count===2?"Two best net scores added":"All three net scores added"} · hole by hole · 1 point</div></div>${chip}</div>
    <div class="status"><div class="srow"><span class="big">${r.leader?`<span style="color:${T[r.leader].c}">${segText(r)}</span>`:segText(r)}</span></div>
    <div class="dotrow">${Array.from({length:6},(_,k)=>{const x=r.rows[k]; const n=s.from+k; if(!x) return `<span class="hd">${n}</span>`; return x.w?`<span class="hd w0" style="background:${T[x.w].c}">${n}</span>`:`<span class="hd h">${n}</span>`;}).join("")}</div>
    ${r.played?`<div class="small muted">Won: ${T.ab.name} ${r.wa} · ${T.bb.name} ${r.wb} · halved ${r.hv}</div>`:""}</div></section>`;});
  h+=`<section class="panel"><div class="head nine" style="padding:12px 14px;border-bottom:1px solid var(--line)"><div class="title"><b>Groups</b></div></div><div class="groups" style="padding-top:12px">${GROUPS.map(gr=>`<div class="gcard"><div><b>${gr.time}</b> <span class="muted">thru ${Math.min(...gr.ids.map(id=>S[id].length))}</span></div>${gr.ids.map(id=>`<div>${sw(P[id].t)} ${P[id].n}</div>`).join("")}</div>`).join("")}</div></section>
  <h2>Round 2 · Sun 20 Sep · Le Val · 12:00</h2>
  <section class="panel nine"><div class="head"><div><div class="title">Singles match play · 18 holes</div><div class="fmt">Three head-to-head matches, scored across groups · 1 point each</div></div><span class="chip">Pairings TBC</span></div>
  <div class="status small">${R2.map(([a,b])=>`<div class="vs"><span>${sw(P[a].t)} ${P[a].n}</span><span class="muted">v</span><span>${P[b].n} ${sw(P[b].t)}</span></div>`).join("")}
  <p class="note" style="margin:4px 0 0">Players don't need to be in the same group. Each hole goes to the better net score; the match is decided like normal match play.</p></div></section>`;
  return h;
}

function vScore(){
  const gr=GROUPS[st.group], s=SEGS[st.seg], n=st.hole[st.group], ho=H[n-1];
  const sN=segOf(n);
  let h=`<div class="seg">${GROUPS.map((x,i)=>`<button data-group="${i}" aria-pressed="${i===st.group}">${x.time} · ${T[x.team].name}</button>`).join("")}</div>
  <div class="seg3">${SEGS.map((x,i)=>`<button class="segcard" data-segi="${i}" aria-pressed="${i===st.seg}"><div class="k">${x.from}–${x.to}</div><div class="d">${x.label}</div></button>`).join("")}</div>
  <div class="strip6">${Array.from({length:6},(_,k)=>{const m=s.from+k; const done=gr.ids.every(id=>g(id,m)!=null); return `<button data-hole="${m}" class="${m===n?"cur":done?"done":""}">${m}</button>`;}).join("")}</div>`;
  const th=teamHole(gr.team,n);
  h+=`<section class="panel"><div class="hole"><img src="${IMGS[n]}" alt="Hole ${n} layout"><div><div class="hno">${n}</div><div class="hname">${ho.name}</div>
    <div class="facts"><div><span>Par</span><b>${ho.par}</b></div><div><span>SI</span><b>${ho.si}</b></div><div><span>Jaune m</span><b>${ho.m}</b></div></div>
    <div class="counted" style="margin-top:8px">${sN.label} count this hole</div></div></div>`;
  gr.ids.forEach(id=>{const p=P[id],v=g(id,n),sh=shots(p.h,ho.si),nv=net(id,n);
    const counts=th&&th.used.includes(id);
    h+=`<div class="prow ${th&&!counts?"notcounted":""}"><div><div class="pname">${sw(p.t)} ${p.n}</div><div class="pmeta">Hcp ${p.h} <span class="dots">${"●".repeat(sh)||'<span class="muted">no shot</span>'}</span>${nv!=null?` · net ${nv}`:""}${counts?` <span class="counted">✓ counts</span>`:""}</div></div>
    <div class="step"><button data-d="-1" data-p="${id}" aria-label="One fewer">−</button><span class="val ${v==null?"ghost":v<ho.par?"u":""}">${v??ho.par}</span><button data-d="1" data-p="${id}" aria-label="One more">+</button><button class="pu" aria-label="Picked up">P</button></div></div>`;});
  const hr=hole(n);
  const other=gr.team==="ab"?"bb":"ab";
  const oth=teamHole(other,n);
  h+=`<div class="hb"><div class="side"><span class="small">${sw(gr.team)} ${T[gr.team].name}</span><span class="n">${th?th.score:"–"}</span></div>
    <div class="mid">${hr?`<b>${hr.w?T[hr.w].name+" win":"Halved"}</b>hole ${n}`:`<b>Hole ${n}</b>team net`}</div>
    <div class="side r"><span class="small">${T[other].name} ${sw(other)}</span><span class="n">${oth?oth.score:'<span class="muted" style="font-size:16px">waiting</span>'}</span></div></div></section>
  <section class="panel matchbar" style="border-radius:10px">${SEGS.map(x=>{const r=segResult(x); return `<div class="srow"><span>Holes ${x.from}–${x.to}</span><b>${r.leader?`<span style="color:${T[r.leader].c}">${segText(r)}</span>`:segText(r)}</b></div>`;}).join("")}</section>
  <div class="nav"><button data-nav="-1" ${n===1?"disabled":""}>‹ Hole ${n-1||""}</button><button class="primary" data-nav="1">${n===18?"Save hole":`Hole ${n+1} ›`}</button></div>
  <p class="note">Each player enters their own gross score as normal. The app works out net scores, picks the best one, two or three for the team, and compares with the other team once both groups have played the hole.</p>`;
  return h;
}

function vBoard(){
  const segs=[["cup","Team cup"],["holes","Hole by hole"],["r2","Round 2"]];
  let h=`<div class="seg">${segs.map(([k,l])=>`<button data-board="${k}" aria-pressed="${st.board===k}">${l}</button>`).join("")}</div>`;
  if(st.board==="cup"){const c=cup();
    h+=`<section class="panel tw"><table><tr><th class="l">Match</th><th>Status</th><th class="tb">AB</th><th class="tc">BB</th></tr>
    ${SEGS.map(s=>{const r=segResult(s); return `<tr><td class="l"><b>R1 holes ${s.from}–${s.to}</b><div class="small muted">${s.label}</div></td><td class="small">${segText(r)}</td><td class="tot tb">${r.done?(r.leader==="ab"?1:r.leader?0:"½"):"–"}</td><td class="tot tc">${r.done?(r.leader==="bb"?1:r.leader?0:"½"):"–"}</td></tr>`;}).join("")}
    ${R2.map(([a,b])=>`<tr><td class="l"><b>R2 ${P[a].n} v ${P[b].n}</b><div class="small muted">Singles · 18 holes</div></td><td class="small muted">Not started</td><td class="muted">–</td><td class="muted">–</td></tr>`).join("")}
    <tr><td class="l"><b>Total</b></td><td></td><td class="tot tb" style="font-size:30px">${fp(c.ab)}</td><td class="tot tc" style="font-size:30px">${fp(c.bb)}</td></tr></table></section>`;
  } else if(st.board==="holes"){
    h+=`<section class="panel tw"><table><tr><th>Hole</th><th>Par</th><th>Counts</th><th class="tb">AB net</th><th class="tc">BB net</th><th>Won by</th></tr>
    ${H.slice(0,12).map(x=>{const r=hole(x.n); const s=segOf(x.n); return `<tr><td class="tot" style="font-size:18px">${x.n}</td><td>${x.par}</td><td class="small">${s.count===1?"Best 1":s.count===2?"Best 2":"All 3"}</td><td>${r?r.a.score:"–"}</td><td>${r?r.b.score:"–"}</td><td class="small">${r?(r.w?`${sw(r.w)} ${T[r.w].name}`:"Halved"):"–"}</td></tr>`;}).join("")}</table></section>
    <p class="note">Rows continue to hole 18. Tap a hole in the full app to see which scores counted.</p>`;
  } else {
    h+=`<section class="panel list">${R2.map(([a,b])=>`<div class="item" style="cursor:default"><div><b>${sw(P[a].t)} ${P[a].n} v ${P[b].n} ${sw(P[b].t)}</b><div class="sub">${P[a].n} ${P[a].h} · ${P[b].n} ${P[b].h} · ${P[a].h>P[b].h?P[a].n:P[b].n} gets ${Math.abs(P[a].h-P[b].h)} shots over 18</div></div><span class="chip">Not started</span></div>`).join("")}</section>
    <p class="note">Live status reads like "Luke 2 up thru 7", even when the two players are in different groups. The status updates once both have scored the hole.</p>`;
  }
  return h;
}

function vMore(){
  return `<h2>Round 1 setup · Belle Dune</h2>
  <section class="panel">
    <div class="field" style="border-top:0"><label>Format</label><select><option>Team 6-6-6 (custom)</option><option>Better ball Stableford</option><option>Team Stableford</option><option>Texas scramble</option><option>Singles match play</option></select></div>
    ${SEGS.map((s,i)=>`<div class="field"><label>Segment ${i+1}</label><div class="two" style="gap:8px"><select><option>Holes ${s.from}–${s.to}</option></select><select><option ${s.count===1?"selected":""}>Best 1 of team</option><option ${s.count===2?"selected":""}>Best 2 of team</option><option ${s.count===3?"selected":""}>All scores count</option></select></div></div>`).join("")}
    <div class="two"><div class="field"><label>Scoring</label><select><option>Net strokes, hole by hole</option><option>Stableford, hole by hole</option><option>Net strokes, segment total</option></select></div>
    <div class="field"><label>Points</label><select><option>1 per segment</option><option>1 per hole won</option></select></div></div>
    <div class="field"><span class="lock">Segments are flexible: 9 + 9, 6 + 6 + 6, or a full 18. Every existing format stays available for each segment.</span></div>
  </section>
  <h2>Round 2 setup · Le Val</h2>
  <section class="panel">
    <div class="field" style="border-top:0"><label>Format</label><select><option>Singles match play · 18 holes</option></select></div>
    <div class="field"><label>Matches (players can be in different groups)</label>${R2.map(([a,b])=>`<div class="two" style="gap:8px;margin-top:4px"><select><option>${P[a].n}</option></select><select><option>${P[b].n}</option></select></div>`).join("")}</div>
    <div class="two"><div class="field"><label>Allowance</label><select><option>100% of difference</option><option>Full handicaps</option></select></div><div class="field"><label>Points</label><select><option>1 per match</option><option>1 per hole won</option></select></div></div>
  </section>
  <h2>Questions to confirm</h2>
  <div class="ask"><b>1. Net or Stableford?</b> I've assumed net strokes, with each player's shots from their own handicap.</div>
  <div class="ask"><b>2. How points are won on Saturday.</b> I've assumed each 6-hole segment is a mini match (most holes won) worth 1 point, so 3 points on the day. The alternative is 1 point per hole won (18 points).</div>
  <div class="ask"><b>3. Same question for Sunday.</b> I've assumed 1 point per match (3 points). The alternative is 1 point per hole won.</div>
  <div class="ask"><b>4. Picked up.</b> I've assumed a pick-up can't count as a team's best score. If all three pick up, the team loses the hole.</div>`;
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.tab){st.tab=b.dataset.tab; try{localStorage.setItem("tdt-mock2-tab",st.tab)}catch(x){} window.scrollTo(0,0);}
  else if(b.dataset.group){st.group=+b.dataset.group;}
  else if(b.dataset.segi){st.seg=+b.dataset.segi; st.hole[st.group]=SEGS[st.seg].from;}
  else if(b.dataset.hole){st.hole[st.group]=+b.dataset.hole;}
  else if(b.dataset.board){st.board=b.dataset.board;}
  else if(b.dataset.nav){const n=st.hole[st.group]+ +b.dataset.nav; if(n<1||n>18) return; if(+b.dataset.nav>0) GROUPS[st.group].ids.forEach(id=>{if(g(id,n-1)==null){S[id][n-2]=H[n-2].par;}}); st.hole[st.group]=n; st.seg=SEGS.indexOf(segOf(n));}
  else if(b.dataset.d){const id=b.dataset.p,n=st.hole[st.group]; let v=g(id,n); v=(v==null?H[n-1].par:v)+ +b.dataset.d; v=Math.max(1,Math.min(15,v)); while(S[id].length<n-1) S[id].push(H[S[id].length].par); S[id][n-1]=v;}
  else return;
  render();
});
render();
</script>
